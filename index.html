    <script>
      async function loadDiscordUsers() {
      const WORKER_URL = 'https://dcapi.rtx3080ti0415.qzz.io/';
      const container = document.getElementById('discord-list');
    
      try {
        const response = await fetch(WORKER_URL);
        const data = await response.json();
    
        container.innerHTML = ''; // Clear loading text
    
        data.users.forEach(user => {
          // Create an image element
          const img = document.createElement('img');
          img.src = user.icon;
          
          // Set size directly via attributes since you don't want CSS
          img.width = 30;
          img.height = 30;
          img.alt = user.name;
    
          // Create a text node for the name
          const name = document.createTextNode(` ${user.name}`);
    
          // Create a line break
          const br = document.createElement('br');
    
          // Add them to the page
          container.appendChild(img);
          container.appendChild(name);
          container.appendChild(br);
        });
      } catch (error) {
        container.textContent = 'Error loading users.';
      }
    }
    
    loadDiscordUsers();
    </script>
