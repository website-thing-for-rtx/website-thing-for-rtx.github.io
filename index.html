    <script>
      async function loadDiscordUsers() {
      const WORKER_URL = 'https://dcapi.rtx3080ti0415.qzz.io/';
      const container = document.getElementById('discord-list');
    
      try {
        const response = await fetch(WORKER_URL);
        const data = await response.json();
    
        container.innerHTML = '';
    
        data.users.forEach(user => {
          const img = document.createElement('img');
          img.src = user.icon;
          
          img.width = 30;
          img.height = 30;
          img.alt = user.name;
    
          const name = document.createTextNode(` ${user.name}`);
    
          const br = document.createElement('br');
    
          container.appendChild(img);
          container.appendChild(name);
          container.appendChild(br);
        });
      } catch (error) {
        container.textContent = 'th bad happened';
      }
    }
